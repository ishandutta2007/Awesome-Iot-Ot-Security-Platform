<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#071527"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f00ff"/>
      <stop offset="100%" stop-color="#e100ff"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.4"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseParticle {
      0% { opacity: 0.2; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.02); }
      100% { opacity: 0.2; transform: scale(0.98); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }
    .bg-grid { fill: url(#cyberGrid); }
    .anim-pulse { animation: pulseParticle 4s infinite ease-in-out; transform-origin: center; }
    .anim-flow { stroke-dasharray: 20 10; animation: flowLine 15s linear infinite; }
    .anim-float { animation: floatCard 6s ease-in-out infinite; }
  </style>

  <!-- Base Dark Background -->
  <rect width="1200" height="360" fill="url(#bgGradient)" rx="12"/>
  <rect width="1200" height="360" class="bg-grid" rx="12"/>

  <!-- Background Decorative Flow Network / Pulse Shapes (Kept low opacity behind text) -->
  <g opacity="0.35">
    <circle cx="1050" cy="80" r="180" fill="url(#purpleGlow)" opacity="0.15" class="anim-pulse"/>
    <circle cx="150" cy="280" r="140" fill="url(#cyanGlow)" opacity="0.12" class="anim-pulse"/>

    <!-- Network Lines -->
    <path d="M 100 80 Q 300 20 500 90 T 900 60 T 1150 160" fill="none" stroke="#00f2fe" stroke-width="2" class="anim-flow"/>
    <path d="M 50 260 Q 350 320 650 240 T 1100 280" fill="none" stroke="#7f00ff" stroke-width="1.5" class="anim-flow"/>

    <!-- Nodes -->
    <circle cx="500" cy="90" r="4" fill="#00f2fe" filter="url(#neonGlow)"/>
    <circle cx="900" cy="60" r="5" fill="#e100ff" filter="url(#neonGlow)"/>
    <circle cx="650" cy="240" r="4" fill="#00f2fe" filter="url(#neonGlow)"/>
  </g>

  <!-- Decorative Tech Badges on Right Side (Floating quietly) -->
  <g class="anim-float" transform="translate(860, 60)" opacity="0.85">
    <!-- Card 1: Asset Discovery -->
    <rect x="0" y="0" width="280" height="64" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="16" fill="#00f2fe" opacity="0.15"/>
    <path d="M26 32 L38 32 M32 26 L32 38" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="28" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Asset Discovery &amp; Visibility</text>
    <text x="60" y="46" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Modbus • DNP3 • OPC UA • S7comm</text>

    <!-- Card 2: Threat Detection -->
    <rect x="30" y="80" width="280" height="64" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="62" cy="112" r="16" fill="#e100ff" opacity="0.15"/>
    <path d="M56 112 L62 106 L68 112 M62 107 L62 118" stroke="#e100ff" stroke-width="2" stroke-linecap="round"/>
    <text x="90" y="108" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">ICS / OT Threat Detection</text>
    <text x="90" y="126" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Suricata • Zeek • Malcolm • Sigma</text>

    <!-- Card 3: Cyber-Physical Security -->
    <rect x="10" y="160" width="280" height="64" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="42" cy="192" r="16" fill="#3b82f6" opacity="0.15"/>
    <path d="M36 192 L48 192" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
    <text x="70" y="188" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Cyber-Physical Security</text>
    <text x="70" y="206" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">SCADA • Enterprise IoT • Zero Trust</text>
  </g>

  <!-- FOREGROUND CONTENT: Title & Subtitle (Guaranteed high visibility and contrast) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill Category Badge -->
    <g transform="translate(0, 55)">
      <rect width="280" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="15" r="5" fill="#00f2fe" filter="url(#neonGlow)"/>
      <text x="32" y="20" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURATED OT &amp; IOT ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome IoT / OT Security
    </text>

    <!-- Subtitle -->
    <text x="0" y="185" fill="url(#cyanGlow)" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" filter="url(#neonGlow)">
      Industrial Cybersecurity Platforms &amp; Open-Source Tools
    </text>

    <!-- Secondary Text / Description -->
    <text x="0" y="225" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400">
      Comprehensive guide to ICS, SCADA, Operational Technology asset discovery,
    </text>
    <text x="0" y="248" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400">
      threat monitoring, vulnerability management, and commercial &amp; open security stacks.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 275)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="110" height="26" rx="6" fill="#0f172a" stroke="#00f2fe" stroke-width="1" opacity="0.9"/>
      <text x="12" y="17" fill="#00f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">⚡ SaaS Rankings</text>

      <!-- Tag 2 -->
      <rect x="120" y="0" width="140" height="26" rx="6" fill="#0f172a" stroke="#e100ff" stroke-width="1" opacity="0.9"/>
      <text x="132" y="17" fill="#e100ff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">🛡️ Open-Source Stacks</text>

      <!-- Tag 3 -->
      <rect x="270" y="0" width="130" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
      <text x="282" y="17" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">📊 Market Analysis</text>
    </g>
  </g>
</svg>
